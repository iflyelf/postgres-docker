# ==============================================================================
# 3 节点高可用集群（每节点 = etcd + Patroni + PostgreSQL，同容器）
#
#   启动：docker compose -f docker-compose.cluster.yml up -d
#   状态：docker exec pg1 patronictl -c /tmp/patroni.yml list
#   停止：docker compose -f docker-compose.cluster.yml down
#
# 说明：
#   - 3 个节点各自运行一个 etcd 成员组成 DCS 集群（quorum=2，可容忍 1 节点故障）
#   - Patroni 自动选主、流复制、故障切换；数据目录挂载在 ./data/pg{1,2,3}
#   - 每个节点启动时按自身 CPU/内存自动调优 PostgreSQL 参数
#     （CLUSTER_AUTOTUNE=false 可关闭，改用模板参数）
#   - 单机部署请用 docker-compose.yml
# ==============================================================================

name: postgres-cluster

x-pg-common: &pg-common
  image: iflyelf/postgres:latest
  # 集群入口：容器内先启动 etcd，再启动 Patroni 托管 PostgreSQL
  entrypoint: ["/usr/local/bin/cluster-entrypoint.sh"]
  # 需 root 启动以修正挂载目录属主，随后自动降权到 postgres(26) 运行 etcd/Patroni
  user: "0:0"
  # 模拟一个伪终端
  tty: true
  # 打开标准输入,可以接受外部输入
  stdin_open: true
  # 指定容器退出后的重启策略为始终重启
  restart: always
  # 共享内存：PostgreSQL 并行查询/大排序需要
  shm_size: 1gb
  # 指定容器的内核能力(capacity)分配
  # PostgreSQL 仅需普通用户权限, 无需特权模式
  # privileged: true
  # 指定容器的 ulimits 限制值
  ulimits:
    nproc: 65535
    nofile:
        soft: 65535
        hard: 65535
  environment: &pg-env
    # ---------- PostgreSQL 初始化 ----------
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    # 超级用户密码(必填, 放在同目录 .env 中)
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    # 流复制用户密码
    REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl-pass}
    # pg_rewind 用户密码
    REWIND_PASSWORD: ${REWIND_PASSWORD:-rewind-pass}
    # ---------- Patroni ----------
    PATRONI_SCOPE: ${PATRONI_SCOPE:-postgres-cluster}
    PATRONI_LOG_LEVEL: ${PATRONI_LOG_LEVEL:-INFO}
    # DCS: 3 个 etcd 成员
    ETCD_HOSTS: 172.22.1.11:2379,172.22.1.12:2379,172.22.1.13:2379
    # ---------- 自动调优(可选) ----------
    PG_MEMORY_LIMIT: ${PG_MEMORY_LIMIT:-}
    PG_CPU_LIMIT: ${PG_CPU_LIMIT:-}
    PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-}
    CLUSTER_AUTOTUNE: ${CLUSTER_AUTOTUNE:-true}
    # ---------- 本地化 ----------
    TZ: ${TZ:-Asia/Shanghai}
    LANG: ${LANG:-zh_CN.UTF-8}

services:

  # ==================== 节点 1（初始主库候选） ====================
  pg1:
    <<: *pg-common
    hostname: pg1
    container_name: pg1
    environment:
      <<: *pg-env
      PATRONI_NAME: pg1
      PATRONI_CONNECT_HOST: 172.22.1.11
      ETCD_NAME: pg1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.22.1.11:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.22.1.11:2379
      ETCD_INITIAL_CLUSTER: pg1=http://172.22.1.11:2380,pg2=http://172.22.1.12:2380,pg3=http://172.22.1.13:2380
    volumes:
      # 数据目录（含 etcd 数据 + PostgreSQL 数据/归档/日志）
      - ./data/pg1:/data:rw,cached
      # 同步宿主机时区与时间
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.11
        ipv6_address: fe9a:1::11
    ports:
    - "5432:5432"    # PostgreSQL
    - "8008:8008"    # Patroni REST API
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ==================== 节点 2 ====================
  pg2:
    <<: *pg-common
    hostname: pg2
    container_name: pg2
    environment:
      <<: *pg-env
      PATRONI_NAME: pg2
      PATRONI_CONNECT_HOST: 172.22.1.12
      ETCD_NAME: pg2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.22.1.12:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.22.1.12:2379
      ETCD_INITIAL_CLUSTER: pg1=http://172.22.1.11:2380,pg2=http://172.22.1.12:2380,pg3=http://172.22.1.13:2380
    volumes:
      - ./data/pg2:/data:rw,cached
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.12
        ipv6_address: fe9a:1::12
    ports:
    - "5433:5432"
    - "8009:8008"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ==================== 节点 3 ====================
  pg3:
    <<: *pg-common
    hostname: pg3
    container_name: pg3
    environment:
      <<: *pg-env
      PATRONI_NAME: pg3
      PATRONI_CONNECT_HOST: 172.22.1.13
      ETCD_NAME: pg3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.22.1.13:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.22.1.13:2379
      ETCD_INITIAL_CLUSTER: pg1=http://172.22.1.11:2380,pg2=http://172.22.1.12:2380,pg3=http://172.22.1.13:2380
    volumes:
      - ./data/pg3:/data:rw,cached
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.13
        ipv6_address: fe9a:1::13
    ports:
    - "5434:5432"
    - "8010:8008"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s


networks:
  # 网络名以组件名开头(pg_)，便于同主机多组件共处时快速识别
  pg_cluster_net:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: pg_cluster_net
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_forwarding: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
      com.docker.network.bridge.host_binding_ipv6: "::/0"
      com.docker.network.driver.mtu: 1500
    ipam:
      driver: default
      config:
      - subnet: 172.22.1.0/24
        gateway: 172.22.1.1
      - subnet: fe9a:1::/64
        gateway: fe9a:1::1
