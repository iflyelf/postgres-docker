# ==============================================================================
# 3 节点高可用集群（etcd 独立容器 + Patroni + PostgreSQL）
#
#   启动：docker compose -f docker-compose.cluster.yml up -d（需先 cp .env.example .env）
#   状态：docker exec pg1 patronictl -c /tmp/patroni.yml list
#   停止：docker compose -f docker-compose.cluster.yml down
#
# 架构：
#   etcd1/2/3   独立 etcd 容器组成 DCS 集群（quorum=2，可容忍 1 节点故障）
#   pg1/2/3     各自的 Patroni + PostgreSQL，自动选主/流复制/故障切换
#   etcd 与 PostgreSQL 生命周期解耦：重启数据库节点不会影响 DCS，反之亦然
#
# 资源自动调优：每个 pg 节点按自身 CPU/内存计算 PostgreSQL 参数
#   （CLUSTER_AUTOTUNE=false 可关闭，改用模板参数）
# 单机部署请用 docker-compose.yml
# ==============================================================================

name: postgres-cluster

# ==================== PostgreSQL 节点公共配置 ====================
x-pg-common: &pg-common
  image: iflyelf/postgres:latest
  # 集群入口：渲染 Patroni 配置并启动 Patroni 托管 PostgreSQL
  entrypoint: ["/usr/local/bin/cluster-entrypoint.sh"]
  # 需 root 启动以修正挂载目录属主，随后自动降权到 postgres(26)
  user: "0:0"
  tty: true
  stdin_open: true
  restart: always
  # 共享内存：PostgreSQL 并行查询/大排序需要
  shm_size: 1gb
  ulimits:
    nproc: 65535
    nofile:
        soft: 65535
        hard: 65535
  environment: &pg-env
    # ---------- PostgreSQL 初始化 ----------
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    # 超级用户密码（必填，放在同目录 .env 中）
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl-pass}
    REWIND_PASSWORD: ${REWIND_PASSWORD:-rewind-pass}
    # ---------- Patroni / DCS ----------
    PATRONI_SCOPE: ${PATRONI_SCOPE:-postgres-cluster}
    PATRONI_LOG_LEVEL: ${PATRONI_LOG_LEVEL:-INFO}
    # 使用独立 etcd 容器（不在此容器内启动 etcd）
    ETCD_EMBEDDED: "false"
    ETCD_HOSTS: 172.22.1.21:2379,172.22.1.22:2379,172.22.1.23:2379
    # ---------- 自动调优（可选） ----------
    PG_MEMORY_LIMIT: ${PG_MEMORY_LIMIT:-}
    PG_CPU_LIMIT: ${PG_CPU_LIMIT:-}
    PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-}
    CLUSTER_AUTOTUNE: ${CLUSTER_AUTOTUNE:-true}
    # ---------- 本地化 ----------
    TZ: ${TZ:-Asia/Shanghai}
    LANG: ${LANG:-zh_CN.UTF-8}

# ==================== etcd 公共配置 ====================
x-etcd-common: &etcd-common
  image: iflyelf/postgres:latest
  # 独立 etcd 容器：修正数据目录权限后降权运行 etcd
  entrypoint: ["/usr/local/bin/etcd-entrypoint.sh"]
  user: "0:0"
  restart: always
  environment: &etcd-env
    ETCD_DATA_DIR: /etcd-data
    ETCD_INITIAL_CLUSTER_STATE: ""
    ETCD_INITIAL_CLUSTER_TOKEN: ${ETCD_CLUSTER_TOKEN:-postgres-cluster}
    ETCD_INITIAL_CLUSTER: etcd1=http://172.22.1.21:2380,etcd2=http://172.22.1.22:2380,etcd3=http://172.22.1.23:2380
    TZ: ${TZ:-Asia/Shanghai}

services:

  # ==================== DCS: etcd 1 ====================
  etcd1:
    <<: *etcd-common
    hostname: etcd1
    container_name: etcd1
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.22.1.21:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.22.1.21:2379
    volumes:
      - ./data/etcd1:/etcd-data:rw,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.21
        ipv6_address: fe9a:1::21
    # 仅集群内部使用，如需外部访问可放开 2379
    # ports:
    # - "12379:2379"
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=http://127.0.0.1:2379 --command-timeout=3s endpoint health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== DCS: etcd 2 ====================
  etcd2:
    <<: *etcd-common
    hostname: etcd2
    container_name: etcd2
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.22.1.22:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.22.1.22:2379
    volumes:
      - ./data/etcd2:/etcd-data:rw,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.22
        ipv6_address: fe9a:1::22
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=http://127.0.0.1:2379 --command-timeout=3s endpoint health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== DCS: etcd 3 ====================
  etcd3:
    <<: *etcd-common
    hostname: etcd3
    container_name: etcd3
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://172.22.1.23:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://172.22.1.23:2379
    volumes:
      - ./data/etcd3:/etcd-data:rw,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.23
        ipv6_address: fe9a:1::23
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=http://127.0.0.1:2379 --command-timeout=3s endpoint health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== PostgreSQL 节点 1 ====================
  pg1:
    <<: *pg-common
    hostname: pg1
    container_name: pg1
    environment:
      <<: *pg-env
      PATRONI_NAME: pg1
      PATRONI_CONNECT_HOST: 172.22.1.11
      ETCD_NAME: pg1
    volumes:
      # PostgreSQL 数据/归档/日志
      - ./data/pg1:/data:rw,cached
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.11
        ipv6_address: fe9a:1::11
    ports:
    - "5432:5432"    # PostgreSQL
    - "8008:8008"    # Patroni REST API
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ==================== PostgreSQL 节点 2 ====================
  pg2:
    <<: *pg-common
    hostname: pg2
    container_name: pg2
    environment:
      <<: *pg-env
      PATRONI_NAME: pg2
      PATRONI_CONNECT_HOST: 172.22.1.12
      ETCD_NAME: pg2
    volumes:
      - ./data/pg2:/data:rw,cached
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.12
        ipv6_address: fe9a:1::12
    ports:
    - "5433:5432"
    - "8009:8008"
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ==================== PostgreSQL 节点 3 ====================
  pg3:
    <<: *pg-common
    hostname: pg3
    container_name: pg3
    environment:
      <<: *pg-env
      PATRONI_NAME: pg3
      PATRONI_CONNECT_HOST: 172.22.1.13
      ETCD_NAME: pg3
    volumes:
      - ./data/pg3:/data:rw,cached
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
    networks:
      pg_cluster_net:
        ipv4_address: 172.22.1.13
        ipv6_address: fe9a:1::13
    ports:
    - "5434:5432"
    - "8010:8008"
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s


networks:
  # 网络名以组件名开头(pg_)，便于同主机多组件共处时快速识别
  pg_cluster_net:
    driver: bridge
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: pg_cluster_net
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_forwarding: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
      com.docker.network.bridge.host_binding_ipv6: "::/0"
      com.docker.network.driver.mtu: 1500
    ipam:
      driver: default
      config:
      - subnet: 172.22.1.0/24
        gateway: 172.22.1.1
      - subnet: fe9a:1::/64
        gateway: fe9a:1::1
